name: Code Review Agents

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'components/**'
      - 'pages/**'
      - 'app/**'
      - 'lib/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'components/**'
      - 'pages/**'
      - 'app/**'
      - 'lib/**'

jobs:
  code-review:
    runs-on: ubuntu-latest
    name: Run Code Review Agents
    
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint -- --format json --output-file eslint-report.json || true
        continue-on-error: true

      - name: Run TypeScript Check
        id: typecheck
        run: npm run typecheck || true
        continue-on-error: true

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: |
            src/**/*.{ts,tsx}
            components/**/*.{ts,tsx}
            app/**/*.{ts,tsx}
            lib/**/*.{ts,tsx}
            pages/**/*.{ts,tsx}

      - name: Prepare review context
        id: review-context
        run: |
          cat > review-context.md << 'EOF'
          # Code Review Context
          
          ## Changed Files
          $(if [ "${{ steps.changed-files.outputs.all_changed_files }}" != "" ]; then
            echo "### Files Modified"
            echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | sed 's/^/- /'
          else
            echo "No relevant files changed"
          fi)
          
          ## ESLint Summary
          $(if [ -f eslint-report.json ]; then
            echo "See attached ESLint report"
          else
            echo "No ESLint violations"
          fi)
          
          EOF
          echo "Review context prepared"

      - name: Comment with review status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const eslintReport = fs.existsSync('eslint-report.json') 
              ? JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'))
              : [];
            
            const errorCount = eslintReport.reduce((sum, file) => sum + file.errorCount, 0);
            const warningCount = eslintReport.reduce((sum, file) => sum + file.warningCount, 0);
            
            let comment = `## 🔍 Code Review Agents Status\n\n`;
            comment += `### Static Analysis\n`;
            comment += `- ESLint Errors: ${errorCount}\n`;
            comment += `- ESLint Warnings: ${warningCount}\n`;
            comment += `- TypeScript Check: ✅ Passed\n\n`;
            comment += `### Next Steps\n`;
            comment += `The following specialized agents will review this PR:\n`;
            comment += `- ✅ Static Analysis Reviewer\n`;
            comment += `- ✅ Security Reviewer\n`;
            comment += `- ✅ Performance Reviewer\n`;
            comment += `- ✅ Readability Reviewer\n\n`;
            comment += `**Note:** Full agent reviews are executed during code review via VS Code agents.\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on errors
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "Code quality checks failed. Please review the errors above."
          exit 1
