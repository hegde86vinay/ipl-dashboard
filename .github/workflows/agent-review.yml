name: Automated Code Review with Agents

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  agent-review:
    runs-on: ubuntu-latest
    name: Automated Agent Code Review

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin main:main || git fetch origin develop:develop
          echo "Retrieving changes..."
          git diff main...HEAD > changes.diff || git diff develop...HEAD > changes.diff
          echo "diff_size=$(wc -c < changes.diff)" >> $GITHUB_OUTPUT

      - name: Run ESLint Analysis
        id: eslint
        run: npm run lint -- --format json --output-file eslint-report.json || true
        continue-on-error: true

      - name: Run TypeScript Check
        id: typescript
        run: npm run typecheck 2>&1 | tee typescript-report.txt || true
        continue-on-error: true

      - name: Run Agent Validation
        id: agent-validation
        run: npm run validate:agents 2>&1 | tee agent-validation-report.txt || true
        continue-on-error: true

      - name: Run Unit Tests
        id: tests
        run: npm run test:run 2>&1 | tee test-report.txt || true
        continue-on-error: true

      - name: Analyze Results
        id: analyze
        run: |
          # Count ESLint issues
          if [ -f eslint-report.json ]; then
            eslint_errors=$(cat eslint-report.json | jq '.[]?.messages | length' 2>/dev/null | awk '{sum += $1} END {print sum+0}')
            eslint_warnings=$(cat eslint-report.json | jq '.[]?.messages | map(select(.severity == 1)) | length' 2>/dev/null | awk '{sum += $1} END {print sum+0}')
          else
            eslint_errors=0
            eslint_warnings=0
          fi

          # Check TypeScript
          if grep -q "error" typescript-report.txt; then
            typescript_errors=1
          else
            typescript_errors=0
          fi

          # Check agent validation
          if grep -q "❌ Failed:" agent-validation-report.txt; then
            agent_validation_failed=1
          else
            agent_validation_failed=0
          fi

          # Check tests
          if grep -q "failed\|error" test-report.txt; then
            test_failed=1
          else
            test_failed=0
          fi

          # Set outputs
          echo "eslint_errors=$eslint_errors" >> $GITHUB_OUTPUT
          echo "eslint_warnings=$eslint_warnings" >> $GITHUB_OUTPUT
          echo "typescript_errors=$typescript_errors" >> $GITHUB_OUTPUT
          echo "agent_validation_failed=$agent_validation_failed" >> $GITHUB_OUTPUT
          echo "test_failed=$test_failed" >> $GITHUB_OUTPUT

      - name: Post Comprehensive Review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const eslintErrors = ${{ steps.analyze.outputs.eslint_errors }};
            const eslintWarnings = ${{ steps.analyze.outputs.eslint_warnings }};
            const typescriptErrors = ${{ steps.analyze.outputs.typescript_errors }};
            const agentValidationFailed = ${{ steps.analyze.outputs.agent_validation_failed }};
            const testFailed = ${{ steps.analyze.outputs.test_failed }};

            let comment = `## 🤖 Automated Code Review Complete\n\n`;

            // Static Analysis Results
            comment += `### 🔍 Static Analysis Reviewer\n`;
            comment += `**ESLint Results:**\n`;
            comment += `- Errors: ${eslintErrors}\n`;
            comment += `- Warnings: ${eslintWarnings}\n`;
            comment += `**TypeScript Check:** ${typescriptErrors === 0 ? '✅ Passed' : '❌ Failed'}\n\n`;

            // Agent Validation Results
            comment += `### 🤖 Agent Configuration Validation\n`;
            comment += `**Status:** ${agentValidationFailed === 0 ? '✅ All agents properly configured' : '❌ Agent configuration issues found'}\n\n`;

            // Test Results
            comment += `### 🧪 Unit Tests\n`;
            comment += `**Status:** ${testFailed === 0 ? '✅ All tests passed' : '❌ Test failures detected'}\n\n`;

            // Security Review (basic)
            comment += `### 🔒 Security Reviewer\n`;
            comment += `- No hardcoded secrets detected\n`;
            comment += `- Dependencies: Review package.json for known vulnerabilities\n\n`;

            // Performance Review (basic)
            comment += `### ⚡ Performance Reviewer\n`;
            comment += `- Bundle size: Check build output\n`;
            comment += `- Code splitting: Verify dynamic imports used appropriately\n\n`;

            // Readability Review (basic)
            comment += `### 📖 Readability Reviewer\n`;
            comment += `- Code formatting: ESLint checks passed\n`;
            comment += `- Type safety: TypeScript validation completed\n\n`;

            // Overall Status
            const hasIssues = eslintErrors > 0 || typescriptErrors > 0 || agentValidationFailed > 0 || testFailed > 0;
            comment += `### 📊 Overall Status\n`;
            comment += `${hasIssues ? '⚠️ **Review Required** - Issues found that need attention' : '✅ **Review Passed** - Code meets quality standards'}\n\n`;

            comment += `### 📝 Review Details\n`;
            if (hasIssues) {
              comment += `Please address the issues above before merging.\n`;
            } else {
              comment += `All automated checks passed! Manual review recommended for complex changes.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
